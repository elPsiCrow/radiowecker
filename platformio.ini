; Radiowecker build configuration. One environment per supported hardware board.
; Build:  pio run -e esp32_ili9341
; Upload: pio run -e esp32_ili9341 -t upload
;
; Windows: the Arduino core libraries have paths over 260 characters. Either enable Windows long paths or
; point PlatformIO at a short directory (PLATFORMIO_CORE_DIR=C:\pio) before the first build.

[platformio]
default_envs = yb_esp32_s3_amp

[env]
; Arduino-ESP32 3.x is only available through the community pioarduino platform; pinned for reproducible builds.
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -Wextra

; Libraries shared by all variants of the full application.
[app]
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    earlephilhower/ESP8266Audio@2.4.1

; LVGL TFT driver; lv_conf.h lives next to the driver sources.
[lvgl_tft]
lib_deps =
    lvgl/lvgl@~9.5.0
    adafruit/Adafruit GFX Library@1.12.5
    adafruit/Adafruit ILI9341@1.6.3
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    -Isrc/drivers/display/lvgl_ili9341
    -DHAS_LVGL_TFT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_USE_DRAW_SW_ASM=0
    -DLV_USE_NATIVE_HELIUM_ASM=0

; Host-side unit tests for hardware-independent code: pio test -e native
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<app/alarm_schedule.cpp> +<drivers/input/buttons/button_tracker.cpp>
build_flags = -std=gnu++17 -Wall -Wextra -Isrc

; Primary development target: YelloByte YB-ESP32-S3-AMP Rev.3 (ESP32-S3-WROOM-1 N8R2). Serial is the native
; USB port (CDC on boot). Newer revisions use board = yb_esp32s3_amp.
; Display and input are the serial console until more drivers exist.
[env:yb_esp32_s3_amp]
board = yb_esp32s3_amp_v3
build_src_filter = +<*> -<board_check.cpp> -<drivers/display/lvgl_ili9341/> +<../hardware/yb_esp32_s3_amp/board_setup.cpp>
lib_deps =
    ${app.lib_deps}
build_flags =
    ${env.build_flags}
    -Ihardware/yb_esp32_s3_amp
    -DBOARD_YB_ESP32_S3_AMP
    -DRADIO_DEBUG_SERIAL=1  ; Bring-up: detailed boot and audio logs on the serial port
    -DCORE_DEBUG_LEVEL=3    ; Bring-up: Arduino core info logs (Wi-Fi events etc.)

; Original hardware (ESP32 DevKit + ILI9341/XPT2046 + MAX98357A). Kept as a reference build.
[env:esp32_ili9341]
board = esp32dev
board_build.partitions = no_fs.csv
build_src_filter = +<*> -<board_check.cpp> -<drivers/display/serial/> -<drivers/input/> +<../hardware/esp32_ili9341/board_setup.cpp>
lib_deps =
    ${app.lib_deps}
    ${lvgl_tft.lib_deps}
build_flags =
    ${env.build_flags}
    ${lvgl_tft.build_flags}
    -Ihardware/esp32_ili9341
    -DBOARD_ESP32_ILI9341
